services:
  - type: web
    name: medivault-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: .
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false

  - type: web
    name: medivault-ml
    env: docker
    dockerfilePath: ./ml-service/Dockerfile
    rootDir: .
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5002
